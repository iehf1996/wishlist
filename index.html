    white-space: nowrap;

<script>
(async function () {
  const wishlist = document.getElementById('wishlist');
  const products = Array.from(
    wishlist.querySelectorAll('.product')
  );

  const SCALE = 0.5;
  const ALPHA_THRESHOLD = 12;

  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d', {
    willReadFrequently: true
  });

  const preparedProducts = [];

  // Холст для обводки
  const outlineCanvas = document.createElement('canvas');
  outlineCanvas.style.position = 'absolute';
  outlineCanvas.style.inset = '0';
  outlineCanvas.style.width = '100%';
  outlineCanvas.style.height = '100%';
  outlineCanvas.style.pointerEvents = 'none';
  outlineCanvas.style.zIndex = '13';

  wishlist.appendChild(outlineCanvas);

  const outlineContext = outlineCanvas.getContext('2d');

  function resizeOutlineCanvas() {
    const rect = wishlist.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    outlineCanvas.width = Math.round(rect.width * dpr);
    outlineCanvas.height = Math.round(rect.height * dpr);

    outlineContext.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function clearOutline() {
    const rect = wishlist.getBoundingClientRect();

    outlineContext.clearRect(
      0, 0, rect.width, rect.height
    );
  }

  function getProductAt(clientX, clientY) {
    const rect = wishlist.getBoundingClientRect();

    const x = clientX - rect.left;
    const y = clientY - rect.top;

    if (
      x < 0 || y < 0 ||
      x > rect.width || y > rect.height
    ) {
      return null;
    }

    const relativeX = x / rect.width;
    const relativeY = y / rect.height;

    for (const product of preparedProducts) {
      const px = Math.floor(
        relativeX * product.width
      );

      const py = Math.floor(
        relativeY * product.height
      );

      if (
        px < 0 || py < 0 ||
        px >= product.width ||
        py >= product.height
      ) {
        continue;
      }

      const index = py * product.width + px;

      if (product.alpha[index] > ALPHA_THRESHOLD) {
        return product;
      }
    }

    return null;
  }

  function drawOutline(product) {
    clearOutline();

    if (!product) return;

    const rect = wishlist.getBoundingClientRect();

    const thickness = parseFloat(
      getComputedStyle(document.documentElement)
        .getPropertyValue('--outline-thickness')
    ) || 2;

    const color = getComputedStyle(
      document.documentElement
    ).getPropertyValue('--outline-color').trim() || '#bb403b';

    // Рисуем тени по кругу вокруг силуэта
    const shadows = [];

    for (let angle = 0; angle < 360; angle += 45) {
      const rad = angle * Math.PI / 180;

      const dx = Math.cos(rad) * thickness;
      const dy = Math.sin(rad) * thickness;

      shadows.push(
        `drop-shadow(${dx}px ${dy}px 0 ${color})`
      );
    }

    outlineContext.save();

    outlineContext.filter = shadows.join(' ');

    // Рисуем PNG с его настоящей прозрачностью
    outlineContext.drawImage(
      product.element,
      0, 0,
      rect.width,
      rect.height
    );

    // Убираем само изображение, оставляя только обводку
    outlineContext.filter = 'none';
    outlineContext.globalCompositeOperation = 'destination-out';

    outlineContext.drawImage(
      product.element,
      0, 0,
      rect.width,
      rect.height
    );

    outlineContext.restore();
  }

  try {
    for (const img of products) {
      if (!img.complete || !img.naturalWidth) {
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });
      }

      await img.decode();

      const width = Math.round(img.naturalWidth * SCALE);
      const height = Math.round(img.naturalHeight * SCALE);

      canvas.width = width;
      canvas.height = height;

      context.clearRect(0, 0, width, height);
      context.drawImage(img, 0, 0, width, height);

      const imageData = context.getImageData(
        0, 0, width, height
      );

      const alpha = new Uint8Array(width * height);

      for (let i = 0; i < alpha.length; i++) {
        alpha[i] = imageData.data[i * 4 + 3];
      }

      preparedProducts.push({
        element: img,
        width,
        height,
        alpha,
        href: img.dataset.link,
        name: img.dataset.name,
        zIndex: Number(
          getComputedStyle(img).zIndex
        )
      });
    }

    preparedProducts.sort(
      (a, b) => b.zIndex - a.zIndex
    );

    resizeOutlineCanvas();

    wishlist.dataset.ready = 'true';

  } catch (error) {
    console.error(
      'Ошибка подготовки изображений:',
      error
    );

    wishlist.dataset.ready = 'error';
    return;
  }

  // Обводка при наведении
  wishlist.addEventListener('pointermove', function (event) {
    const product = getProductAt(
      event.clientX,
      event.clientY
    );

    drawOutline(product);
  });

  wishlist.addEventListener('pointerleave', clearOutline);

  // Переход по ссылке при клике
  wishlist.addEventListener('click', function (event) {
    if (wishlist.dataset.ready !== 'true') return;

    const product = getProductAt(
      event.clientX,
      event.clientY
    );

    if (product) {
      window.open(
        product.href,
        '_blank',
        'noopener,noreferrer'
      );
    }
  });

  // Пересчёт размеров при изменении окна
  window.addEventListener('resize', function () {
    resizeOutlineCanvas();
    clearOutline();
  });

})();
</script>
