<style>
  * {

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  .wishlist {
    position: relative;
    width: 100vw;
    margin: 0;
    aspect-ratio: 3500 / 3063;
    overflow: hidden;
    isolation: isolate;
  }

  .layer {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    user-select: none;
  }

  .product {
    cursor: pointer;
  }

  /* Белый слой поверх всего макета */
  .highlight-overlay {
    position: absolute;
    inset: 0;
    z-index: 13;
    background: rgba(255, 255, 255, 0.2);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .highlight-overlay.active {
    opacity: 1;
  }

  /* Копия выбранного товара поверх белого слоя */
  .highlight-product {
    position: absolute;
    inset: 0;
    z-index: 14;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    display: none;
  }

  .highlight-product.active {
    display: block;
  }

  .accessible-links {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<script>
(async function () {
  const wishlist = document.getElementById('wishlist');
  const overlay = document.getElementById('highlightOverlay');
  const highlightProduct = document.getElementById('highlightProduct');

  const products = Array.from(
    wishlist.querySelectorAll('.product')
  );

  const SCALE = 0.5;
  const ALPHA_THRESHOLD = 12;

  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d', {
    willReadFrequently: true
  });

  const preparedProducts = [];

  function getProductAt(clientX, clientY) {
    const rect = wishlist.getBoundingClientRect();

    const x = clientX - rect.left;
    const y = clientY - rect.top;

    if (
      x < 0 || y < 0 ||
      x > rect.width || y > rect.height
    ) {
      return null;
    }

    const relativeX = x / rect.width;
    const relativeY = y / rect.height;

    for (const product of preparedProducts) {
      const px = Math.floor(relativeX * product.width);
      const py = Math.floor(relativeY * product.height);

      if (
        px < 0 || py < 0 ||
        px >= product.width ||
        py >= product.height
      ) {
        continue;
      }

      const index = py * product.width + px;

      if (product.alpha[index] > ALPHA_THRESHOLD) {
        return product;
      }
    }

    return null;
  }

  function showHighlight(product) {
    if (!product) {
      overlay.classList.remove('active');
      highlightProduct.classList.remove('active');
      highlightProduct.removeAttribute('src');
      return;
    }

    highlightProduct.src = product.element.src;

    overlay.classList.add('active');
    highlightProduct.classList.add('active');
  }

  try {
    for (const img of products) {
      if (!img.complete || !img.naturalWidth) {
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });
      }

      await img.decode();

      const width = Math.round(img.naturalWidth * SCALE);
      const height = Math.round(img.naturalHeight * SCALE);

      canvas.width = width;
      canvas.height = height;

      context.clearRect(0, 0, width, height);
      context.drawImage(img, 0, 0, width, height);

      const imageData = context.getImageData(
        0, 0, width, height
      );

      const alpha = new Uint8Array(width * height);

      for (let i = 0; i < alpha.length; i++) {
        alpha[i] = imageData.data[i * 4 + 3];
      }

      preparedProducts.push({
        element: img,
        width,
        height,
        alpha,
        href: img.dataset.link,
        name: img.dataset.name,
        zIndex: Number(getComputedStyle(img).zIndex)
      });
    }

    preparedProducts.sort(
      (a, b) => b.zIndex - a.zIndex
    );

    wishlist.dataset.ready = 'true';

  } catch (error) {
    console.error('Ошибка подготовки изображений:', error);
    wishlist.dataset.ready = 'error';
    return;
  }

  wishlist.addEventListener('pointermove', function (event) {
    const product = getProductAt(
      event.clientX,
      event.clientY
    );

    showHighlight(product);
  });

  wishlist.addEventListener('pointerleave', function () {
    showHighlight(null);
  });

  wishlist.addEventListener('click', function (event) {
    if (wishlist.dataset.ready !== 'true') return;

    const product = getProductAt(
      event.clientX,
      event.clientY
    );

    if (product) {
      window.open(
        product.href,
        '_blank',
        'noopener,noreferrer'
      );
    }
  });

})();
</script>
